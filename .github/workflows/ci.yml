name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  backend:
  # -------------------------------------------------------------------------
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          cd apps/api
          pytest tests/ -v --tb=short

      - name: Run verify.sh
        run: bash scripts/verify.sh

  # -------------------------------------------------------------------------
  frontend:
  # -------------------------------------------------------------------------
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (type-check + production bundle)
        working-directory: apps/web
        run: npm run build

  # -------------------------------------------------------------------------
  repo-hygiene:
  # -------------------------------------------------------------------------
    name: Repo Hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No .env committed
        run: test ! -f .env

      - name: No venvs, caches, or pycache committed
        run: |
          ! git ls-files | grep -E '(^|/)(node_modules|\.venv|__pycache__|\.pytest_cache)(/|$)'

      - name: No model artifacts committed
        run: |
          ! git ls-files | grep -E '^models/.+' | grep -vE '^models/(\.gitkeep|forecasting/\.gitkeep)$'

      - name: No generated data files committed
        run: |
          ! git ls-files | grep -E '^data/(raw|processed|sample_uploads)/.+' | grep -v '\.gitkeep$'

      - name: No obvious secret files
        run: |
          ! git ls-files | grep -E '\.(pem|key|p12|pfx|crt|csr)$'

      - name: CI workflow exists
        run: test -f .github/workflows/ci.yml

      - name: Dependabot config exists
        run: test -f .github/dependabot.yml
