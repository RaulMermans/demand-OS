version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demandos
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: demandos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demandos"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://demandos:changeme@db:5432/demandos
      ENVIRONMENT: production
      DEBUG: "false"
      ACTIVE_CONNECTOR: mock
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  # web:  # Sprint 7 — Dockerfile for Next.js
  #   build:
  #     context: apps/web
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://api:8000
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api

volumes:
  postgres_data:
